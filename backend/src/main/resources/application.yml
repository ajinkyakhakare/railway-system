# F1 | owner: Foundation | purpose: all configuration keys of contract C2 (other tasks only READ them with @Value)
server:
  port: 8081

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/railway_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:root}"
  data:
    mongodb:
      uri: "mongodb://localhost:27017/railway_ops?serverSelectionTimeoutMS=2000"
  jackson:
    serialization:
      write-dates-as-timestamps: false   # dates/times as ISO-8601 strings, not arrays
    time-zone: Asia/Kolkata
  main:
    allow-bean-definition-overriding: false

app:
  jwt:
    secret: "${JWT_SECRET:change-me-change-me-change-me-change-me-1234}"   # must be >= 32 characters
    expiry-minutes: 120
  auth:
    dev-mode: true                  # responses include devOtp so demos work without email/SMS
    require-login-otp: false
    require-payment-otp: true
  payment:
    mode: MOCK                      # MOCK or RAZORPAY
    razorpay:
      key-id: "${RAZORPAY_KEY_ID:}"
      key-secret: "${RAZORPAY_KEY_SECRET:}"
  mongo:
    enabled: false                  # set to true only after MongoDB is installed
  cors:
    allowed-origin: "http://localhost:5173"
